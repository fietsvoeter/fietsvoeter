name: Fix Encoding Errors

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Fix all encoding errors
        run: |
          python3 << 'ENDOFPYTHON'
          from pathlib import Path
          
          # ALL encoding patterns (byte sequences)
          patterns = [
              # Pattern 1-3: Single character corruptions
              (b'\\xc3\\xa0\\xc3\\x82\\xc2\\xa9', b'\\xc3\\xa9'),      # àÂ© → é
              (b'\\xc3\\xa0\\xc3\\x82\\xc2\\xaf', b'\\xc3\\xaf'),      # àÂ¯ → ï
              (b'\\xc3\\xa0\\xc3\\x82\\xc2\\xab', b'\\xc3\\xab'),      # àÂ« → ë
              
              # Pattern 4: Em-dash (6 bytes)
              (b'\\xc3\\xa0\\xc2\\xa2\\xc3\\x82\\xc2\\x80\\xc3\\x82\\xc2\\x94', b'\\xe2\\x80\\x94'),
              
              # Pattern 5: Middenpunt
              (b'\\xc3\\xa0\\xc3\\x82\\xc2\\xb7', b'\\xc2\\xb7'),      # àÂ· → ·
              
              # Pattern 6-7: NEW - "één" patterns
              (b'a\\xc3\\xa0\\xc3\\x82\\xc2\\xa9', b'\\xc3\\xa9'),     # aàÂ© → é
              (b'Ea\\xc3\\xa0\\xc3\\x82\\xc2\\xa9', b'\\xc3\\x89'),    # EaàÂ© → É
          ]
          
          blog_dir = Path('content/blog')
          if not blog_dir.exists():
              print("ERROR: content/blog directory not found!")
              exit(1)
          
          fixed_count = 0
          total_replacements = 0
          
          for mdx_file in sorted(blog_dir.glob('*.mdx')):
              with open(mdx_file, 'rb') as f:
                  content = f.read()
              
              original = content
              changes = 0
              
              for pattern, replacement in patterns:
                  count = content.count(pattern)
                  if count > 0:
                      content = content.replace(pattern, replacement)
                      changes += count
              
              if content != original:
                  with open(mdx_file, 'wb') as f:
                      f.write(content)
                  fixed_count += 1
                  total_replacements += changes
                  print(f"✓ {mdx_file.name}: {changes} replacements")
          
          print(f"\\n{'='*50}")
          print(f"SUMMARY: {fixed_count} files fixed")
          print(f"         {total_replacements} total replacements")
          print(f"{'='*50}")
          
          if fixed_count == 0:
              print("\\n⚠️  WARNING: No files were fixed!")
              print("This might mean:")
              print("  - Files are already clean")
              print("  - Or patterns don't match")
          ENDOFPYTHON
      
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add content/blog/*.mdx
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix: encoding errors in MDX files (v2 - all patterns)"
            git push
            echo "✓ Changes committed and pushed"
          fi
