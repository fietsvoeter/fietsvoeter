name: Fix Encoding Errors

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Fix ALL encoding errors (comprehensive)
        run: |
          python3 << 'ENDOFPYTHON'
          from pathlib import Path
          
          # COMPREHENSIVE pattern list from scan results
          # Format: (corrupted_bytes, correct_bytes)
          patterns = [
              # TOP PRIORITY - Most common (100+ occurrences)
              
              # Pattern 1: Euro sign € (729x)
              (b'\\xc3\\xa0\\xc2\\xa2\\xc3\\x82\\xc2\\xac', b'\\xe2\\x82\\xac'),  # à¢ÂÂ¬ → €
              
              # Pattern 2: Middenpunt · (268x)
              (b'\\xc3\\xa0\\xc3\\x82\\xc2\\xb7', b'\\xc2\\xb7'),  # àÂ· → ·
              
              # Pattern 3-4: "één" word (121x + 106x = 227x total)
              (b'\\xc3\\xa0\\xc3\\x82\\xc2\\xa9\\xc3\\xa0\\xc3\\x82\\xc2\\xa9n', b'\\xc3\\xa9\\xc3\\xa9n'),  # àÂ©àÂ©n → één
              
              # Pattern 5: "ï" in proteïne, cafeïne (100x)
              (b'\\xc3\\xa0\\xc3\\x82\\xc2\\xafne', b'\\xc3\\xafne'),  # àÂ¯ne → ïne
              (b'\\xc3\\xa0\\xc3\\x82\\xc2\\xaf', b'\\xc3\\xaf'),      # àÂ¯ → ï
              
              # Pattern 6: "ë" in categorieën (73x)
              (b'\\xc3\\xa0\\xc3\\x82\\xc2\\xabn', b'\\xc3\\xabn'),    # àÂ«n → ën
              (b'\\xc3\\xa0\\xc3\\x82\\xc2\\xab', b'\\xc3\\xab'),      # àÂ« → ë
              
              # MEDIUM PRIORITY (10-99 occurrences)
              
              # Pattern 7: Em-dash — 
              (b'\\xc3\\xa0\\xc2\\xa2\\xc3\\x82\\xc2\\x80\\xc3\\x82\\xc2\\x94', b'\\xe2\\x80\\x94'),  # à¢ÂÂ → —
              
              # Pattern 8: "é" standalone (14x)
              (b'\\xc3\\xa0\\xc3\\x82\\xc2\\xa9', b'\\xc3\\xa9'),      # àÂ© → é
              
              # Pattern 9: "ël" in reëel (9x)
              (b'\\xc3\\xa0\\xc3\\x82\\xc2\\xabel', b'\\xc3\\xabel'),  # àÂ«el → ël
              
              # Pattern 10: "ën" in variëren (8x)
              (b'\\xc3\\xa0\\xc3\\x82\\xc2\\xabren', b'\\xc3\\xabren'), # àÂ«ren → ëren
              
              # Pattern 11: "ën" in nutriënten (7x)
              (b'\\xc3\\xa0\\xc3\\x82\\xc2\\xabnten', b'\\xc3\\xabnten'), # àÂ«nten → ënten
              
              # Pattern 12: "ë" in België (7x)
              (b'\\xc3\\xa0\\xc3\\x82\\xc2\\xab', b'\\xc3\\xab'),      # àÂ« → ë
              
              # Pattern 13: "él" in wél (5x)
              (b'\\xc3\\xa0\\xc3\\x82\\xc2\\xa9l', b'\\xc3\\xa9l'),    # àÂ©l → él
              
              # FALLBACK - Catch remaining single char corruptions
              (b'\\xc3\\xa0\\xc3\\x82\\xc2\\xa9', b'\\xc3\\xa9'),      # àÂ© → é (any remaining)
              (b'\\xc3\\xa0\\xc3\\x82\\xc2\\xaf', b'\\xc3\\xaf'),      # àÂ¯ → ï (any remaining)
              (b'\\xc3\\xa0\\xc3\\x82\\xc2\\xab', b'\\xc3\\xab'),      # àÂ« → ë (any remaining)
          ]
          
          blog_dir = Path('content/blog')
          if not blog_dir.exists():
              print("ERROR: content/blog directory not found!")
              exit(1)
          
          fixed_files = 0
          total_replacements = 0
          pattern_stats = {}
          
          for mdx_file in sorted(blog_dir.glob('*.mdx')):
              with open(mdx_file, 'rb') as f:
                  content = f.read()
              
              original = content
              file_changes = 0
              
              for i, (pattern, replacement) in enumerate(patterns):
                  count = content.count(pattern)
                  if count > 0:
                      content = content.replace(pattern, replacement)
                      file_changes += count
                      
                      # Track stats
                      if i not in pattern_stats:
                          pattern_stats[i] = {'count': 0, 'files': 0}
                      pattern_stats[i]['count'] += count
                      pattern_stats[i]['files'] += 1
              
              if content != original:
                  with open(mdx_file, 'wb') as f:
                      f.write(content)
                  fixed_files += 1
                  total_replacements += file_changes
                  print(f"✓ {mdx_file.name}: {file_changes} fixes")
          
          print(f"\\n{'='*60}")
          print(f"SUMMARY:")
          print(f"  Files fixed: {fixed_files}")
          print(f"  Total replacements: {total_replacements}")
          print(f"{'='*60}")
          
          if pattern_stats:
              print(f"\\nPATTERN STATISTICS:")
              for i, stats in sorted(pattern_stats.items()):
                  print(f"  Pattern {i+1}: {stats['count']} replacements in {stats['files']} files")
          
          if fixed_files == 0:
              print("\\n⚠️  No files were fixed!")
              print("Files might already be clean or patterns don't match.")
          else:
              print(f"\\n✅ Successfully fixed {fixed_files} files!")
          ENDOFPYTHON
      
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add content/blog/*.mdx
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix: comprehensive encoding error correction (all patterns)"
            git push
            echo "✅ Changes committed and pushed successfully"
          fi
