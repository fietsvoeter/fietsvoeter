name: Fix Encoding Errors

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Fix encoding errors in all MDX files
        run: |
          python3 << 'ENDOFPYTHON'
          from pathlib import Path
          
          # ALLE encoding patterns als byte sequences
          patterns = [
              # Pattern 1: Plus-minus (Â±)
              (b'\xc3\x82\xc2\xb1', b'\xc2\xb1'),
              
              # Pattern 2: Euro corruption (€¬)
              (b'\xe2\x82\xac\xc2\xac', b'\xe2\x82\xac'),
              
              # Pattern 3: Middenpunt (ÃÂ·)
              (b'\xc3\x83\xc3\x82\xc2\xb7', b'\xc2\xb7'),
              
              # Pattern 4: Em-dash (à¢ÂÂ)
              (b'\xc3\xa0\xc2\xa2\xc3\x82\xc2\x80\xc3\x82\xc2\x94', b'\xe2\x80\x94'),
              
              # Pattern 5: Multiplication (àÂ)
              (b'\xc3\xa0\xc3\x82', b'\xc3\x97'),
              
              # Pattern 6: Degrees (Â°)
              (b'\xc3\x82\xc2\xb0', b'\xc2\xb0'),
              
              # Pattern 7-9: Accented characters
              (b'\xc3\xa0\xc3\x82\xc2\xa9', b'\xc3\xa9'),  # é
              (b'\xc3\xa0\xc3\x82\xc2\xaf', b'\xc3\xaf'),  # ï
              (b'\xc3\xa0\xc3\x82\xc2\xab', b'\xc3\xab'),  # ë
          ]
          
          blog_dir = Path('content/blog')
          
          if not blog_dir.exists():
              print("❌ ERROR: content/blog directory not found!")
              exit(1)
          
          fixed_count = 0
          total_replacements = 0
          
          print("Scanning all MDX files...")
          print("=" * 60)
          
          for mdx_file in sorted(blog_dir.glob('*.mdx')):
              # Read file in BINARY mode
              with open(mdx_file, 'rb') as f:
                  content = f.read()
              
              original = content
              changes = 0
              
              # Apply all patterns
              for pattern, replacement in patterns:
                  count = content.count(pattern)
                  if count > 0:
                      content = content.replace(pattern, replacement)
                      changes += count
              
              # Write back if changed
              if content != original:
                  with open(mdx_file, 'wb') as f:
                      f.write(content)
                  fixed_count += 1
                  total_replacements += changes
                  print(f"✓ {mdx_file.name}: {changes} replacements")
          
          print("=" * 60)
          print(f"SUMMARY:")
          print(f"  Files fixed: {fixed_count}")
          print(f"  Total replacements: {total_replacements}")
          print("=" * 60)
          
          if fixed_count == 0:
              print("⚠️  No files needed fixing (already clean)")
          
          ENDOFPYTHON
      
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add content/blog/*.mdx
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix: encoding errors in MDX files"
            git push
            echo "✓ Changes committed and pushed"
          fi
