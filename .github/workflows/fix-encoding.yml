name: Fix Encoding Errors

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Fix encoding with EXACT source bytes
        run: |
          python3 << 'ENDOFPYTHON'
          from pathlib import Path
          
          # EXACT patterns from raw byte analysis of source files
          patterns = [
              # Pattern 1: "é" → cafés, België, etc.
              (b'\\xc3\\xa0\\xc2\\x83\\xc3\\x82\\xc2\\xa9', b'\\xc3\\xa9'),
              
              # Pattern 2: "ë" → Sportdiëtist, categorieën
              (b'\\xc3\\xa0\\xc2\\x83\\xc3\\x82\\xc2\\xab', b'\\xc3\\xab'),
              
              # Pattern 3: "ï" → Cafeïne, proteïne
              (b'\\xc3\\xa0\\xc2\x83\\xc3\\x82\\xc2\\xaf', b'\\xc3\\xaf'),
              
              # Pattern 4: Middenpunt ·
              (b'\\xc3\\xa0\\xc2\\x82\\xc3\\x82\\xc2\\xb7', b'\\xc2\\xb7'),
              
              # Pattern 5: Euro €
              (b'\\xc3\\xa0\\xc2\\xa2\\xc3\\x82\\xc2\\x82\\xc3\\x82\\xc2\\xac', b'\\xe2\\x82\\xac'),
              
              # Pattern 6: Em-dash —
              (b'\\xc3\\xa0\\xc2\\xa2\\xc3\\x82\\xc2\\x80\\xc3\\x82\\xc2\\x94', b'\\xe2\\x80\\x94'),
              
              # SHORTER VARIANTS (fallbacks for partial matches)
              (b'\\xc2\\x83\\xc3\\x82\\xc2\\xa9', b'\\xc3\\xa9'),  # Short é
              (b'\\xc2\\x83\\xc3\\x82\\xc2\\xab', b'\\xc3\\xab'),  # Short ë
              (b'\\xc2\\x83\\xc3\\x82\\xc2\\xaf', b'\\xc3\\xaf'),  # Short ï
          ]
          
          blog_dir = Path('content/blog')
          if not blog_dir.exists():
              print("ERROR: content/blog not found!")
              exit(1)
          
          fixed_files = 0
          total_replacements = 0
          
          for mdx_file in sorted(blog_dir.glob('*.mdx')):
              with open(mdx_file, 'rb') as f:
                  content = f.read()
              
              original = content
              file_changes = 0
              
              for pattern, replacement in patterns:
                  count = content.count(pattern)
                  if count > 0:
                      content = content.replace(pattern, replacement)
                      file_changes += count
              
              if content != original:
                  with open(mdx_file, 'wb') as f:
                      f.write(content)
                  fixed_files += 1
                  total_replacements += file_changes
                  print(f"✓ {mdx_file.name}: {file_changes} fixes")
          
          print(f"\\n{'='*60}")
          print(f"SUMMARY: {fixed_files} files fixed, {total_replacements} replacements")
          print(f"{'='*60}")
          
          if fixed_files == 0:
              print("\\n⚠️  No files were changed!")
              print("Possible reasons:")
              print("  - Files already fixed")
              print("  - Patterns don't match (check byte analysis)")
          else:
              print(f"\\n✅ Successfully fixed {fixed_files} files!")
          ENDOFPYTHON
      
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add content/blog/*.mdx
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix: encoding errors (exact source bytes)"
            git push
            echo "✅ Pushed successfully"
          fi
