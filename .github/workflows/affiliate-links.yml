name: Bol.com Affiliate Links

on:
  push:
    branches: [main]
    paths:
      - 'content/blog/**.mdx'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  update-affiliate-links:
    runs-on: ubuntu-latest
    # Sla over als de commit van de affiliate bot zelf is
    if: "!contains(github.event.head_commit.message, '[skip ci]') && github.actor != 'affiliate-bot'"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verwerk bol.com affiliate links
        env:
          BOL_CLIENT_ID: ${{ secrets.BOL_CLIENT_ID }}
          BOL_CLIENT_SECRET: ${{ secrets.BOL_CLIENT_SECRET }}
          BOL_PARTNER_ID: ${{ secrets.BOL_PARTNER_ID }}
        run: node scripts/affiliate-links.js

      - name: Commit en push bijgewerkte links
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add content/blog/
          git diff --staged --quiet && echo "Geen wijzigingen" && exit 0
          git commit -m "Auto: bol.com affiliate links bijgewerkt [skip ci]"
          git pull --rebase origin main || true
          git push --force-with-lease origin main || true
